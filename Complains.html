<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo3 - LetsShare</title>
    <link rel="icon" href="assets/Logo3.jpeg" type="image/jpeg">
    <style>
        :root {
            --bg-main: #b1b3b9;
            --card-bg: #fafbfd;
            --text: #2d3748;
            --muted: #718096;
            --border: #e2e8f0;
            --accent: #4f7cde;
            --accent-dark: #375bb1;
            --shadow: rgba(0, 0, 0, 0.08);
        }

        html[data-theme="dark"] {
            --bg-main: #1a202c;
            --card-bg: #2d3748;
            --text: #e2e8f0;
            --muted: #a0aec0;
            --border: #4a5568;
            --accent: #63b3ed;
            --accent-dark: #3f8fd7;
            --shadow: rgba(0, 0, 0, 0.18);
        }

        * {
            box-sizing: border-box;
        }

        .logo {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 12px;
            transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg-main);
            color: var(--text);
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .page-wrapper {
            width: 100%;
            max-width: 980px;
            margin: 0 auto;
            padding: 3rem 1rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.8rem, 2.5vw, 2.4rem);
        }

        #themeToggle {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            padding: 0.5rem;
            border-radius: 12px;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        #themeToggle:hover {
            transform: scale(1.05);
            background: rgba(255,255,255,0.18);
            box-shadow: 0 10px 20px rgba(0,0,0,0.12);
        }

        .form-card {
            background: var(--card-bg);
            border-radius: 18px;
            border: 1px solid var(--border);
            box-shadow: 0 18px 40px var(--shadow);
            padding: 2rem;
        }

        .form-group {
            display: grid;
            gap: 0.45rem;
            margin-bottom: 1rem;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text);
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 0.95rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79, 124, 222, 0.15);
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 0.95rem 1.5rem;
            cursor: pointer;
            font-weight: 700;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 10px 20px rgba(79, 124, 222, 0.2);
        }

        .btn-secondary {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .message {
            border-radius: 12px;
            padding: 1rem 1.1rem;
            margin-bottom: 1.25rem;
            display: none;
        }

        #confirmationMessage {
            background: rgba(72, 187, 120, 0.12);
            color: #1f5132;
            border: 1px solid rgba(72, 187, 120, 0.3);
        }

        #errorMessage {
            background: rgba(220, 53, 69, 0.12);
            color: #7f1d1d;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="header">

            <div class="header-left">
                <a href="index.html" class="brand">
                    <img src="assets/Logo3.jpeg" class="logo">
                    <h1>LetsShare</h1>
                </a>

                <p class="page-subtitle">Log Return</p>
            </div>

            <button id="themeToggle">🌙</button>

        </div>

        <div class="form-card">
            <div id="confirmationMessage" class="message"></div>
            <div id="errorMessage" class="message"></div>

            <form id="issueForm">

                <div class="form-group">
                    <label for="borrowId">Borrow ID</label>
                    <input type="text" id="borrowId" required>
                </div>

                <div class="form-group">
                    <label for="itemName">Item Name</label>
                    <input type="text" id="itemName" required>
                </div>

                <div class="form-group">
                    <label for="borrowerName">Borrower Name</label>
                    <input type="text" id="borrowerName" required>
                </div>

                <div class="form-group">
                    <label for="issueType">Issue Type</label>
                    <select id="issueType" required>
                        <option value="">Select issue</option>
                        <option value="damage">Damage</option>
                        <option value="lost">Lost Item</option>
                        <option value="late">Late Return</option>
                        <option value="misuse">Misuse</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="severity">Severity</label>
                    <select id="severity" required>
                        <option value="">Select severity</option>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="issueDescription">Description</label>
                    <textarea id="issueDescription" required></textarea>
                </div>

                <div class="form-group">
                    <label for="beforeImage">Before (when given)</label>
                    <input type="file" id="beforeImage" accept="image/*">
                </div>

                <div class="form-group">
                    <label for="afterImage">After (current condition)</label>
                    <input type="file" id="afterImage" accept="image/*" required>
                </div>

                <div class="actions">
                    <button type="submit" class="btn-primary">Submit Report</button>
                    <button type="reset" class="btn-secondary">Clear</button>
                </div>

            </form>
        </div>
    </div>

    <script src="Complains.js"></script>
</body>
</html>
