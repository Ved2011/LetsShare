<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <script>
        (function() {
            var savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Following - LetsShare</title>
    <link rel="icon" href="assets/Light_Logo1.png" type="image/jpeg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-wrapper">
        <header class="header">
            <div>
                <h2>Following</h2>
                <p>Stay updated with people you follow.</p>
            </div>
        </header>

        <section class="card">
            <h3>Recent Uploads from Following</h3>
            <div id="followingItemsGrid" class="community-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.5rem; margin-top: 1.5rem;">
                <p class="empty-state">no items</p>
            </div>
        </section>

        <section class="card">
            <h3>People You Follow</h3>
            <div id="followingUsersList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; margin-top: 1rem;">
                <p class="empty-state">no followed users</p>
            </div>
        </section>
    </div>

    <script src="sidebar.js"></script>
    <script>
        async function loadFollowingData() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                // Load items
                const itemsRes = await fetch('/api/users/following/items', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const itemsGrid = document.getElementById('followingItemsGrid');
                
                if (!itemsRes.ok) {
                    if (itemsRes.status === 403 || itemsRes.status === 401) {
                        itemsGrid.innerHTML = '<p class="empty-state" style="color: var(--danger);">Session expired. Please log in again.</p>';
                    } else {
                        itemsGrid.innerHTML = '<p class="empty-state" style="color: var(--danger);">Server error loading items.</p>';
                    }
                    return;
                }

                const items = await itemsRes.json();
                
                if (items.length === 0) {
                    itemsGrid.innerHTML = '<p class="empty-state">No recent uploads from people you follow.</p>';
                } else {
                    itemsGrid.innerHTML = items.map(item => `
                        <div class="item-card">
                            <div style="height: 150px; background: #eee; border-radius: 8px; overflow: hidden; margin-bottom: 1rem;">
                                ${item.imageBase64 ? `<img src="${item.imageBase64}" style="width: 100%; height: 100%; object-fit: cover;">` : '<div style="display: flex; align-items: center; justify-content: center; height: 100%; color: #aaa;">No Image</div>'}
                            </div>
                            <h4>${item.name}</h4>
                            <p style="font-size: 0.8rem; color: var(--muted);">By ${item.owner_name}</p>
                            <div style="margin-top: 1rem; display: flex; justify-content: space-between; align-items: center;">
                                <span class="status-pill ${item.status}">${item.status}</span>
<<<<<<< HEAD
                                <a href="item_View.html?id=${item.id}" class="btn small">View</a>
=======
                                <a href="item_Details.html?id=${item.id}" class="btn small">View</a>
>>>>>>> 5d0a726 (wer)
                            </div>
                        </div>
                    `).join('');
                }

                // Load followed users
                const usersRes = await fetch('/api/users/following', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const users = await usersRes.json();
                const usersList = document.getElementById('followingUsersList');

                if (users.length === 0) {
                    usersList.innerHTML = '<p class="empty-state">You are not following anyone yet.</p>';
                } else {
                    usersList.innerHTML = users.map(u => `
                        <div class="card" onclick="window.location.href='user_View.html?id=${u.id}'" style="margin-bottom: 0; padding: 1.25rem; display: flex; align-items: center; gap: 1rem; cursor: pointer; transition: all 0.2s ease;">
                            <div class="header-avatar" style="width: 45px; height: 45px; font-size: 1rem;">${u.name.charAt(0).toUpperCase()}</div>
                            <div style="flex-grow: 1;">
                                <h4 style="margin: 0; font-size: 1.1rem;">${u.name}</h4>
                                <p style="margin: 0; font-size: 0.85rem; color: var(--muted);">@${u.username || u.email.split('@')[0]}</p>
                            </div>
                            <button onclick="event.stopPropagation(); unfollowUser(${u.id})" class="btn small outline" style="border-color: var(--danger); color: var(--danger);">Unfollow</button>
                        </div>
                    `).join('');
                }
            } catch (err) {
                console.error('Error loading following data:', err);
            }
        }

        async function unfollowUser(id) {
            if (!confirm('Stop following this user?')) return;
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`/api/users/${id}/follow`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) loadFollowingData();
            } catch (err) {
                console.error('Unfollow error:', err);
            }
        }

        document.addEventListener('DOMContentLoaded', loadFollowingData);
    </script>
</body>
</html>
