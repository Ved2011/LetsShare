<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <script>
        (function() {
            var savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Home - LetsShare</title>
    <link rel="icon" href="assets/Light_Logo1.png" type="image/jpeg">
    <link rel="stylesheet" href="style.css">
    <style>
        .community-header-hero {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: white;
            padding: 3rem 2rem;
            border-radius: 24px;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }
        .community-header-hero::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            pointer-events: none;
        }
        .chat-container-home {
            height: 60vh;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
        }
        #chatBox {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .chat-input-area {
            padding: 1rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 0.75rem;
        }
        .chat-msg {
            max-width: 80%;
            padding: 0.8rem 1rem;
            border-radius: 14px;
            font-size: 0.95rem;
            position: relative;
        }
        .chat-msg.mine {
            align-self: flex-end;
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 2px;
        }
        .chat-msg.theirs {
            align-self: flex-start;
            background: #f1f5f9;
            color: var(--text);
            border-bottom-left-radius: 2px;
        }
        .msg-info {
            display: block;
            font-size: 0.7rem;
            margin-bottom: 0.2rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <header class="header">
            <div class="header-left">
                <button class="menu-toggle" id="menuToggle">☰</button>
                <a href="welcome.html" class="brand">
                    <img src="assets/Light_Logo3.png" alt="Logo" class="header-logo">
                </a>
            </div>
            <div class="header-center">
                <h1 class="page-title" id="communityName">Loading Community...</h1>
            </div>
            <div class="header-right">
                <input type="text" id="communityHomeSearch" placeholder="Search items or members..." class="input-minimal" style="width: 200px;" />
            </div>
        </header>

        <div class="community-header-hero">
            <h2 id="heroCommName">Community Name</h2>
            <p id="heroCommAddress"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> no address</p>
            <button id="adminPanelBtn" class="btn small" style="display: none; margin-top: 1.5rem; background: rgba(255, 255, 255, 0.2); color: white; border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 8px; font-weight: 600; cursor: pointer; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                Manage Community
            </button>
            <div style="display: flex; gap: 1.5rem; margin-top: 1.5rem;">
                <div>
                    <strong id="memberCount">0</strong>
                    <span style="opacity: 0.9;"> Members</span>
                </div>
                <div>
                    <strong id="itemCount">0</strong>
                    <span style="opacity: 0.9;"> Items</span>
                </div>
            </div>
        </div>

        <div class="community-content-wrapper">
            <!-- Left Side: Recent Uploads -->
            <section>
                <div class="section-heading">
                    <h3>Recent Uploads</h3>
                </div>
                <div id="communityItemsGrid" class="items-square-grid">
                    <!-- Items will be loaded here -->
                </div>
                
                <div id="memberSearchResults" class="hidden" style="margin-top: 2rem;">
                    <h3>Members</h3>
                    <div id="membersGrid" class="community-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem;"></div>
                </div>
            </section>

            <!-- Right Side: Chat -->
            <section id="chatSectionHome">
                <div class="section-heading">
                    <h3>Community Chat</h3>
                </div>
                <div class="chat-container-home" id="chatDisabledMsg" style="display: none; justify-content: center; align-items: center; text-align: center; padding: 2rem;">
                    <div>
                        <span style="display:inline-block"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
                        <p style="margin-top: 1rem; color: var(--muted);">Chat is disabled for this community.</p>
                    </div>
                </div>
                <div class="chat-container-home" id="chatActiveArea">
                    <div id="chatBox"></div>
                    <div class="chat-input-area">
                        <input type="text" id="chatInput" placeholder="Type a message..." class="search-bar" style="border-radius: 12px; padding-left: 1rem;">
                        <button id="sendChatBtn" class="btn primary small">Send</button>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="notifications.js"></script>
    <script src="sidebar.js"></script>
    <script src="community_Home.js"></script>
    <!-- Admin Management Modal -->
    <div id="adminModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; width: 90%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.15);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h3 style="margin: 0; color: var(--text);">Manage Community</h3>
                <button onclick="document.getElementById('adminModal').style.display = 'none'" style="background: none; border: none; font-size: 1.5rem; color: var(--muted); cursor: pointer;">&times;</button>
            </div>
            
            <!-- Toggle Chat -->
            <div style="margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border);">
                <h4 style="margin: 0 0 0.5rem 0; font-size: 0.95rem;">Community Chat</h4>
                <button id="adminToggleChatBtn" class="btn small primary">Toggle Chat</button>
            </div>

            <!-- Invite Member -->
            <div style="margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border);">
                <h4 style="margin: 0 0 0.5rem 0; font-size: 0.95rem;">Invite User</h4>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="adminInviteEmail" class="input-minimal" placeholder="Email or Username" style="flex: 1;">
                    <button id="adminSendInviteBtn" class="btn small primary">Send</button>
                </div>
            </div>

            <!-- Delete Community -->
            <div style="margin-bottom: 1.5rem; padding-bottom: 1.5rem;">
                <h4 style="margin: 0 0 0.5rem 0; font-size: 0.95rem; color: #ef4444;">Danger Zone</h4>
                <button id="adminDeleteCommBtn" class="btn small outline" style="color: #ef4444; border-color: #ef4444;">Delete Community</button>
            </div>
        </div>
    </div>
</body>
</html>
