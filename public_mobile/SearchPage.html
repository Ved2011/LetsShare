<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <script>
        (function() {
            var savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Search - LetsShare</title>
    <link rel="icon" href="assets/Light_Logo1.png" type="image/jpeg">
    <link rel="stylesheet" href="style.css">
    <style>
        .search-wrap {
            padding: 0 0.75rem 4rem;
        }

        /* ── Search box ── */
        .search-box-wrapper {
            position: relative;
            margin-bottom: 0.75rem;
        }
        .search-box {
            width: 100%;
            padding: 0.9rem 2.75rem 0.9rem 3rem;
            font-size: 1rem;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }
        .search-box:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 3px rgba(79,124,222,0.12);
        }
        .search-icon {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            width: 18px; height: 18px;
            color: var(--muted);
            pointer-events: none;
        }
        .search-clear {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            width: 22px; height: 22px;
            color: var(--muted);
            cursor: pointer;
            display: none;
            background: none;
            border: none;
            padding: 0;
            align-items: center;
            justify-content: center;
        }
        .search-clear.visible { display: flex; }
        .search-clear:hover { color: var(--text); }

        /* ── Suggestions dropdown ── */
        .suggestions-dropdown {
            position: absolute;
            top: calc(100% + 5px);
            left: 0; right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            z-index: 100;
            overflow: hidden;
            display: none;
        }
        html[data-theme="dark"] .suggestions-dropdown {
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .suggestions-dropdown.visible { display: block; }
        .suggestion-item {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.6rem 0.9rem;
            cursor: pointer;
            transition: background 0.15s;
            text-decoration: none;
            color: inherit;
            font-size: 0.9rem;
        }
        .suggestion-item:hover,
        .suggestion-item.focused { background: rgba(0,0,0,0.04); }
        html[data-theme="dark"] .suggestion-item:hover,
        html[data-theme="dark"] .suggestion-item.focused { background: rgba(255,255,255,0.06); }
        .suggestion-icon {
            width: 28px; height: 28px;
            border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; color: white;
        }
        .suggestion-meta {
            font-size: 0.68rem; color: var(--muted);
            margin-left: auto; flex-shrink: 0;
        }
        .suggestions-section-label {
            font-size: 0.65rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.06em;
            color: var(--muted); padding: 0.45rem 0.9rem 0.2rem;
        }
        .suggestion-sep { border: none; border-top: 1px solid var(--border); margin: 0.2rem 0; }

        /* ── Recent ── */
        .recent-searches { display: none; flex-direction: column; }
        .recent-searches.visible { display: flex; }
        .recent-header { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0.9rem 0.15rem; }
        .recent-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
        .clear-recent-btn { font-size: 0.7rem; color: var(--accent); background: none; border: none; cursor: pointer; font-family: inherit; }
        .recent-item { display: flex; align-items: center; gap: 0.55rem; padding: 0.5rem 0.9rem; cursor: pointer; color: var(--text); transition: background 0.15s; font-size: 0.88rem; }
        .recent-item:hover { background: rgba(0,0,0,0.04); }
        html[data-theme="dark"] .recent-item:hover { background: rgba(255,255,255,0.06); }
        .recent-remove { margin-left: auto; background: none; border: none; color: var(--muted); cursor: pointer; padding: 0; font-size: 0.85rem; display: none; }
        .recent-item:hover .recent-remove { display: block; }

        /* ── Toolbar ── */
        .search-toolbar {
            display: flex; gap: 0.4rem;
            margin-bottom: 0.75rem;
            overflow-x: auto; padding-bottom: 2px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .search-toolbar::-webkit-scrollbar { display: none; }
        .cat-chip {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 0.3rem 0.7rem;
            border-radius: 999px;
            border: 2px solid var(--border);
            background: var(--card-bg);
            color: var(--muted);
            font-size: 0.75rem; font-weight: 600;
            cursor: pointer; transition: all 0.18s;
            font-family: inherit; white-space: nowrap; flex-shrink: 0;
        }
        .cat-chip:hover { border-color: var(--accent); color: var(--text); }
        .cat-chip.active { background: var(--accent); border-color: var(--accent); color: white; }
