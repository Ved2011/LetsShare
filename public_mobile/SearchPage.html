<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Search - LetsShare</title>
    <link rel="icon" href="/assets/Logo3.jpeg" type="image/jpeg">
    <link rel="stylesheet" href="style.css">
    <style>
        .search-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem;
        }

        .search-box-wrapper {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .search-box {
            width: 100%;
            padding: 1.25rem 1.5rem 1.25rem 3.5rem;
            font-size: 1.2rem;
            border-radius: 16px;
            border: 2px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            transition: all 0.3s ease;
        }

        .search-box:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 4px rgba(79, 124, 222, 0.1);
        }

        .search-icon-large {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.5rem;
            color: var(--muted);
        }

        .result-item {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: background 0.2s ease;
            text-decoration: none;
            color: inherit;
        }

        .result-item:hover {
            background: rgba(0, 0, 0, 0.02);
        }

        html[data-theme="dark"] .result-item:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .result-category {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            background: var(--accent);
            color: white;
            margin-bottom: 0.25rem;
            display: inline-block;
        }

        .result-subtext {
            font-size: 0.85rem;
            color: var(--muted);
        }
    </style>
</head>

<body>
    <div class="page-wrapper">
        <header class="header">
            <h2 style="margin: 0;">Global Search</h2>
        </header>

        <div class="search-container">

            <div class="search-box-wrapper">
                <span class="search-icon-large">🔍</span>
                <input type="text" id="globalSearchInput" class="search-box"
                    placeholder="Search communities, items, or users..." autofocus>
            </div>

            <div id="searchResults" class="card" style="padding: 0; min-height: 200px;">
                <p class="empty-state" style="padding: 3rem;">Start typing to search across the platform.</p>
            </div>
        </div>
    </div>

    <script src="sidebar.js"></script>
    <script>
        const searchInput = document.getElementById('globalSearchInput');
        const resultsContainer = document.getElementById('searchResults');

        let debounceTimer;

        searchInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            const query = e.target.value.trim();

            if (query.length < 1) {
                resultsContainer.innerHTML = '<p class="empty-state" style="padding: 3rem;">Start typing to search across the platform.</p>';
                return;
            }

            debounceTimer = setTimeout(() => performSearch(query), 300);
        });

        async function performSearch(query) {
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`/api/users/global-search?q=${encodeURIComponent(query)}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const results = await res.json();

                if (!Array.isArray(results) || results.length === 0) {
                    resultsContainer.innerHTML = '<p class="empty-state" style="padding: 3rem;">No results found for "' + query + '"</p>';
                    if (results.error) {
                        resultsContainer.innerHTML = '<p class="empty-state" style="padding: 3rem; color: var(--danger);">' + results.error + '</p>';
                    }
                    return;
                }

                resultsContainer.innerHTML = results.map(r => {
                    let link = '#';
                    if (r.category === 'Community') link = `community_Home.html?id=${r.id}`;
                    else if (r.category === 'Item') link = `item_Details.html?id=${r.id}`;
                    else if (r.category === 'User') link = `user_View.html?id=${r.id}`;

                    return `
                        <a href="${link}" class="result-item">
                            <div class="header-avatar" style="width: 40px; height: 40px; flex-shrink: 0;">${r.name.charAt(0).toUpperCase()}</div>
                            <div style="flex-grow: 1;">
                                <span class="result-category" style="background: ${getCategoryColor(r.category)}">${r.category}</span>
                                <h4 style="margin: 0;">${r.name}</h4>
                                <p class="result-subtext" style="margin: 0;">${r.subtext}</p>
                            </div>
                            <span style="color: var(--muted);">→</span>
                        </a>
                    `;
                }).join('');
            } catch (err) {
                console.error('Search error:', err);
            }
        }

        function getCategoryColor(cat) {
            switch (cat) {
                case 'Community': return '#10b981';
                case 'Item': return '#3b82f6';
                case 'User': return '#f59e0b';
                default: return '#64748b';
            }
        }
    </script>
</body>

</html>
