<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | LetsShare</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .verify-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: linear-gradient(135deg, var(--bg-main) 0%, var(--bg-offset) 100%);
        }
        .verify-card {
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .logo {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            margin-bottom: 1.5rem;
        }
        h1 { margin-bottom: 0.5rem; color: var(--text-main); }
        p { color: var(--text-muted); margin-bottom: 2rem; }
        
        .otp-input {
            width: 100%;
            padding: 1rem;
            font-size: 2rem;
            text-align: center;
            letter-spacing: 0.5rem;
            border: 2px solid var(--border);
            border-radius: 12px;
            margin-bottom: 2rem;
            font-weight: 700;
            color: var(--accent);
            transition: all 0.3s ease;
        }
        .otp-input:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 4px rgba(79, 124, 222, 0.1);
        }
    </style>
</head>
<body>
    <div class="verify-container">
        <div class="verify-card">
            <img src="assets/Logo2.jpeg" alt="Logo" class="logo">
            <h1>Verify Your Email</h1>
            <p id="instructionText">We've sent a 6-digit verification code to your email. Please enter it below to activate your account.</p>
            
            <form id="verifyForm">
                <input type="text" id="verificationCode" class="otp-input" placeholder="000000" maxlength="6" pattern="\d{6}" required>
                <button type="submit" class="btn primary" style="width: 100%; padding: 1rem;">Verify Account</button>
            </form>
            
            <div style="margin-top: 2rem; font-size: 0.9rem;">
                Didn't receive the code? <a href="#" id="resendBtn" style="color: var(--accent); font-weight: 600;">Resend Email</a>
            </div>
            <div style="margin-top: 1rem;">
                <a href="login.html" style="color: var(--text-muted); text-decoration: none;">Back to Login</a>
            </div>
        </div>
    </div>

    <script src="notifications.js"></script>
    <script src="index.js"></script>
    <script src="verify.js"></script>
</body>
</html>
