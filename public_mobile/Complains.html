<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <script>
        (function() {
            var savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaints - LetsShare</title>
    <link rel="icon" href="assets/Light_Logo1.png" type="image/jpeg">
    <link rel="stylesheet" href="style.css">
    <style>
        .complaints-page { padding: 0 0 6rem; }

        /* Tab bar */
        .tab-bar {
            display: flex; border-bottom: 2px solid var(--border);
            background: var(--card-bg); position: sticky; top: 0; z-index: 50;
        }
        .tab-btn {
            flex: 1; padding: 0.9rem 0.5rem; font-size: 0.78rem; font-weight: 700;
            border: none; background: transparent; color: var(--muted);
            cursor: pointer; border-bottom: 3px solid transparent;
            transition: all 0.2s; margin-bottom: -2px; text-align: center;
        }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

        /* Tab panels */
        .tab-panel { display: none; padding: 1rem; }
        .tab-panel.active { display: block; }

        /* Section title */
        .section-title {
            font-size: 1rem; font-weight: 700; margin: 0 0 1rem;
            color: var(--text-main);
        }

        /* Complaint card */
        .complaint-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 16px; padding: 1rem 1.1rem; margin-bottom: 0.75rem;
            display: flex; flex-direction: column; gap: 0.4rem;
        }
        .complaint-card-header {
            display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem;
        }
        .complaint-item-name { font-weight: 700; font-size: 0.9rem; color: var(--text-main); }
        .complaint-meta { font-size: 0.75rem; color: var(--muted); }

        .severity-badge {
            font-size: 0.65rem; font-weight: 800; padding: 0.2rem 0.5rem;
            border-radius: 6px; text-transform: uppercase; letter-spacing: 0.04em;
            flex-shrink: 0;
        }
        .severity-high { background: rgba(239,68,68,0.12); color: #ef4444; }
        .severity-medium { background: rgba(245,158,11,0.12); color: #f59e0b; }
        .severity-low { background: rgba(16,185,129,0.12); color: #10b981; }

        .complaint-status-badge {
            font-size: 0.65rem; font-weight: 700; padding: 0.18rem 0.45rem;
            border-radius: 6px; text-transform: uppercase;
        }
        .status-pending { background: rgba(245,158,11,0.12); color: #f59e0b; }
        .status-resolved { background: rgba(16,185,129,0.12); color: #10b981; }

        .complaint-desc { font-size: 0.82rem; color: var(--text); line-height: 1.5; }
        .complaint-against-tag {
            font-size: 0.72rem; color: var(--muted);
            display: flex; align-items: center; gap: 0.3rem;
        }

        /* Empty state */
        .empty-complaints { text-align: center; padding: 3rem 1rem; color: var(--muted); }
        .empty-complaints .ei { font-size: 2.5rem; display: block; margin-bottom: 0.5rem; }

        /* New Complaint Form */
        .complaint-form { display: flex; flex-direction: column; gap: 1rem; }

        .form-group-inline { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

        .borrow-lookup-row { display: flex; gap: 0.5rem; align-items: flex-end; }
        .borrow-lookup-row .form-field { flex: 1; }
        .lookup-btn {
            padding: 0.65rem 1rem; border-radius: 12px;
            background: var(--accent); color: white; border: none;
            font-size: 0.8rem; font-weight: 700; cursor: pointer;
            white-space: nowrap; height: fit-content;
        }

        .autofill-preview {
            background: rgba(79, 124, 222, 0.06); border: 1px solid var(--border);
            border-radius: 12px; padding: 0.75rem 1rem; display: none;
            font-size: 0.82rem; gap: 0.3rem; flex-direction: column;
        }
        .autofill-preview.visible { display: flex; }
        .autofill-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
        .autofill-val { font-weight: 600; color: var(--text-main); }

        .form-field label {
            display: block; font-size: 0.78rem; font-weight: 700;
            color: var(--muted); margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.04em;
        }
        .form-field input,
        .form-field select,
        .form-field textarea {
            width: 100%; padding: 0.7rem 0.9rem; border: 1.5px solid var(--border);
            border-radius: 12px; background: var(--card-bg); color: var(--text);
            font-size: 0.88rem; outline: none; transition: border-color 0.2s; box-sizing: border-box;
        }
        .form-field input:focus, .form-field select:focus, .form-field textarea:focus {
            border-color: var(--accent);
        }
        .form-field textarea { resize: vertical; min-height: 80px; }

        .image-upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .image-upload-box {
            border: 2px dashed var(--border); border-radius: 12px;
            padding: 1.25rem 0.5rem; text-align: center; cursor: pointer;
            transition: border-color 0.2s; position: relative; overflow: hidden;
        }
        .image-upload-box:hover { border-color: var(--accent); }
        .image-upload-box input[type="file"] {
            position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
        }
        .upload-icon { font-size: 1.5rem; display: block; margin-bottom: 0.3rem; }
        .upload-label { font-size: 0.72rem; font-weight: 600; color: var(--muted); }

        .submit-complaint-btn {
            width: 100%; padding: 0.9rem; background: var(--accent); color: white;
            border: none; border-radius: 14px; font-size: 0.92rem; font-weight: 700;
            cursor: pointer; transition: opacity 0.2s;
        }
        .submit-complaint-btn:active { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <header class="header">
            <div style="display: flex; align-items: center; gap: 0.75rem;">
                <button class="menu-toggle" id="mobileMenuBtn" style="display: block !important;">
                    <i class="fas fa-bars"></i>
                </button>
                <span style="font-weight: 700; font-size: 1rem; color: var(--text-main);">Complaints</span>
            </div>
            <a href="user_Profile.html" class="header-avatar" id="headerAvatar">?</a>
        </header>

        <div class="complaints-page">
            <!-- Tab Bar -->
            <div class="tab-bar">
                <button class="tab-btn active" onclick="switchTab('unresolved')">⚠️ Unresolved</button>
                <button class="tab-btn" onclick="switchTab('new')">+ New</button>
                <button class="tab-btn" onclick="switchTab('against')">🚨 Against Me</button>
            </div>

            <!-- Tab: Unresolved Complaints (filed by me, not resolved) -->
            <div class="tab-panel active" id="tab-unresolved">
                <p class="section-title">Your Open Complaints</p>
                <div id="unresolvedList">
                    <div class="empty-complaints"><span class="ei">🔄</span><p>Loading…</p></div>
                </div>
            </div>

            <!-- Tab: New Complaint Form -->
            <div class="tab-panel" id="tab-new">
                <p class="section-title">File a New Complaint</p>
                <form class="complaint-form" id="complainForm" onsubmit="submitComplaint(event)">

                    <!-- Borrow ID lookup -->
                    <div class="form-field">
                        <label>Borrow ID</label>
                        <div class="borrow-lookup-row">
                            <div class="form-field" style="margin: 0; flex: 1;">
                                <input type="number" id="borrowId" placeholder="Enter borrow ID…" oninput="clearAutoFill()" required>
                            </div>
                            <button type="button" class="lookup-btn" onclick="lookupBorrow()">Lookup</button>
                        </div>
                    </div>

                    <!-- Auto-filled preview -->
                    <div class="autofill-preview" id="autofillPreview">
                        <span class="autofill-label">Item</span>
                        <span class="autofill-val" id="previewItem">—</span>
                        <span class="autofill-label" style="margin-top: 0.35rem;">Borrower</span>
                        <span class="autofill-val" id="previewBorrower">—</span>
                    </div>

                    <!-- Hidden auto-filled fields -->
                    <input type="hidden" id="itemName">
                    <input type="hidden" id="borrowerName">

                    <!-- Issue type + severity -->
                    <div class="form-group-inline">
                        <div class="form-field">
                            <label>Issue Type</label>
                            <select id="issueType" required>
                                <option value="">Select…</option>
                                <option value="damage">Damage</option>
                                <option value="lost">Lost Item</option>
                                <option value="late">Late Return</option>
                                <option value="misuse">Misuse</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label>Severity</label>
                            <select id="severity" required>
                                <option value="">Select…</option>
                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                    </div>

                    <!-- Description -->
                    <div class="form-field">
                        <label>Description</label>
                        <textarea id="issueDescription" placeholder="Describe the issue in detail…" required></textarea>
                    </div>

                    <!-- Image uploads -->
                    <div class="image-upload-grid">
                        <div class="image-upload-box">
                            <input type="file" id="beforeImage" accept="image/*">
                            <span class="upload-icon">📷</span>
                            <span class="upload-label">Before<br>(when given)</span>
                        </div>
                        <div class="image-upload-box">
                            <input type="file" id="afterImage" accept="image/*" required>
                            <span class="upload-icon">📸</span>
                            <span class="upload-label">After<br>(current)</span>
                        </div>
                    </div>

                    <button type="submit" class="submit-complaint-btn">Submit Complaint</button>
                </form>
            </div>

            <!-- Tab: Complaints Against Me -->
            <div class="tab-panel" id="tab-against">
                <p class="section-title">Complaints Filed Against You</p>
                <div id="againstList">
                    <div class="empty-complaints"><span class="ei">🔄</span><p>Loading…</p></div>
                </div>
            </div>
        </div>
    </div>

    <script src="notifications.js"></script>
    <script src="sidebar.js"></script>
    <script src="Complains.js"></script>
</body>
</html>
