<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration - LetsShare</title>
    <link rel="icon" href="assets/Logo3.jpeg" type="image/jpeg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-wrapper">
        <div class="header">

            <div class="header-left">
                <a href="user_Profile.html" class="brand">
                    <img src="assets/Logo3.jpeg" class="logo" alt="LetsShare logo">
                    <h1>LetsShare</h1>
                </a>

            </div>



        </div>
        <form class="form-card" id="registerForm">
            <div id="confirmationMessage" class="message success"></div>
            <div id="errorMessage" class="message error"></div>
            <h2 class="page-subtitle">Register User</h2>
            
            <div class="form-group">
                <label>Username:</label>
                <input type="text" name="username" required>
            </div>
            
            <div class="form-group">
                <label>Email:</label>
                <input type="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label>Password:</label>
                <input type="password" name="password" required>
            </div>

            <div class="form-group">
                <label>Confirm Password:</label>
                <input type="password" name="confirm_password" required>
            </div>

            <div class="form-group">
                <label>Phone Number:</label>
                <input type="tel" name="phone">
            </div>

            <div class="form-group">
                <label>Date of Birth:</label>
                <input type="date" name="dob">
            </div>

            <div class="form-group">
                <label>Address:</label>
                <input type="text" name="address" required>
            </div>

            <div class="form-actions">
                <button type="submit">Register</button>
                <button type="reset" id="clearButton">reset</button>
            </div>
            <div class="already-registered">
                Already registered? <a href="login.html" class="login-link">Login here</a>.
            </div>
        </form>
    </div>
    
    <script src="User_Register.js"></script>
</body>
</html>
