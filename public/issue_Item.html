<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrow Item - LetsShare</title>
    <link rel="icon" href="assets/Logo3.jpeg" type="image/jpeg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-wrapper">
        <div class="header">
            <div class="header-left">
                <a href="user_Profile.html" class="brand">
                    <img src="assets/Logo3.jpeg" class="logo">
                    <h1>LetsShare</h1>
                </a>
            </div>
            <button id="themeToggle" class="theme-toggle" title="Toggle dark mode">🌙</button>
        </div>

        <div class="form-card">
            <div id="confirmationMessage" class="message"></div>
            <div id="errorMessage" class="message"></div>

            <h2>Browse & Request Items</h2>
            <p>Select an item below to send a borrow request to the owner.</p>

            <div id="itemsList" class="items-grid">
                <p>Loading items...</p>
            </div>
        </div>
    </div>

    <script src="issue_Item.js"></script>
</body>
</html>
