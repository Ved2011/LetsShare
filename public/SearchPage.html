<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <script>
        (function() {
            var savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Search - LetsShare</title>
    <link rel="icon" href="assets/Light_Logo1.png" type="image/jpeg">
    <link rel="stylesheet" href="style.css">
    <style>
        .search-wrap {
            max-width: 860px;
            margin: 0 auto;
            padding: 0 1rem 4rem;
        }

        /* ── Search box ── */
        .search-box-wrapper {
            position: relative;
            margin-bottom: 0.75rem;
        }
        .search-box {
            width: 100%;
            padding: 1rem 3rem 1rem 3.25rem;
            font-size: 1.1rem;
            border-radius: 14px;
            border: 2px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }
        .search-box:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 4px rgba(79,124,222,0.12);
        }
        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            width: 20px; height: 20px;
            color: var(--muted);
            pointer-events: none;
        }
        .search-clear {
            position: absolute;
            right: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            width: 22px; height: 22px;
            color: var(--muted);
            cursor: pointer;
            display: none;
            background: none;
            border: none;
            padding: 0;
            align-items: center;
            justify-content: center;
        }
        .search-clear.visible { display: flex; }
        .search-clear:hover { color: var(--text); }

        .kbd-hint {
            position: absolute;
            right: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.72rem;
            color: var(--muted);
            background: var(--border);
            border-radius: 5px;
            padding: 0.15rem 0.4rem;
            font-family: monospace;
            pointer-events: none;
        }

        /* ── Suggestions dropdown ── */
        .suggestions-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0; right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            z-index: 100;
            overflow: hidden;
            display: none;
        }
        html[data-theme="dark"] .suggestions-dropdown {
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .suggestions-dropdown.visible { display: block; }
        .suggestion-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.65rem 1rem;
            cursor: pointer;
            transition: background 0.15s;
            text-decoration: none;
            color: inherit;
        }
        .suggestion-item:hover,
        .suggestion-item.focused {
            background: var(--hover-bg, rgba(0,0,0,0.04));
        }
        html[data-theme="dark"] .suggestion-item:hover,
        html[data-theme="dark"] .suggestion-item.focused {
            background: rgba(255,255,255,0.06);
        }
        .suggestion-icon {
            width: 30px; height: 30px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            font-size: 0.7rem; font-weight: 700;
            color: white;
        }
        .suggestion-meta {
            font-size: 0.7rem;
            color: var(--muted);
            margin-left: auto;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .suggestions-section-label {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            padding: 0.5rem 1rem 0.25rem;
        }
        .suggestion-sep {
            border: none;
            border-top: 1px solid var(--border);
            margin: 0.25rem 0;
        }

        /* ── Recent searches section ── */
        .recent-searches {
            display: none;
            flex-direction: column;
        }
        .recent-searches.visible { display: flex; }
        .recent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 1rem 0.25rem;
        }
        .recent-label {
            font-size: 0.68rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.06em;
            color: var(--muted);
        }
        .clear-recent-btn {
            font-size: 0.72rem; color: var(--accent);
            background: none; border: none; cursor: pointer;
            font-family: inherit;
        }
        .recent-item {
            display: flex; align-items: center; gap: 0.6rem;
            padding: 0.55rem 1rem;
            cursor: pointer;
            color: var(--text);
            transition: background 0.15s;
            font-size: 0.9rem;
        }
        .recent-item:hover { background: rgba(0,0,0,0.04); }
        html[data-theme="dark"] .recent-item:hover { background: rgba(255,255,255,0.06); }
        .recent-remove {
            margin-left: auto;
            background: none; border: none;
            color: var(--muted); cursor: pointer;
            padding: 0; font-size: 0.9rem;
            display: none;
        }
        .recent-item:hover .recent-remove { display: block; }

        /* ── Toolbar: filters + sort ── */
        .search-toolbar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .cat-chip {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 0.35rem 0.8rem;
            border-radius: 999px;
            border: 2px solid var(--border);
            background: var(--card-bg);
            color: var(--muted);
            font-size: 0.78rem; font-weight: 600;
            cursor: pointer;
            transition: all 0.18s;
            font-family: inherit;
            white-space: nowrap;
        }
        .cat-chip:hover { border-color: var(--accent); color: var(--text); }
        .cat-chip.active { background: var(--accent); border-color: var(--accent); color: white; }
        .cat-chip .chip-count {
            background: rgba(255,255,255,0.28);
            border-radius: 999px;
            padding: 0 5px;
            font-size: 0.7rem;
            min-width: 18px;
            text-align: center;
        }
        .cat-chip:not(.active) .chip-count {
            background: var(--border);
            color: var(--muted);
        }
        .sort-select {
            margin-left: auto;
            font-family: inherit;
            font-size: 0.78rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 0.32rem 0.65rem;
            background: var(--card-bg);
            color: var(--text);
            cursor: pointer;
        }
        .sort-select:focus { outline: none; border-color: var(--accent); }

        /* ── Result cards ── */
        .results-list { display: flex; flex-direction: column; }
        .result-card {
            display: flex; align-items: flex-start; gap: 1rem;
            padding: 0.9rem 1.1rem;
            border-bottom: 1px solid var(--border);
            text-decoration: none; color: inherit;
            transition: background 0.15s;
            animation: fadeSlideIn 0.2s ease both;
        }
        .result-card:last-child { border-bottom: none; }
        .result-card:hover { background: rgba(0,0,0,0.025); }
        html[data-theme="dark"] .result-card:hover { background: rgba(255,255,255,0.04); }
        .result-card.focused { background: rgba(79,124,222,0.07); }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .result-avatar {
            width: 44px; height: 44px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; font-weight: 700;
            color: white; flex-shrink: 0;
        }
        .result-body { flex: 1; min-width: 0; }
        .result-top { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.15rem; }
        .result-badge {
            display: inline-flex; align-items: center; gap: 3px;
            font-size: 0.68rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.04em;
            padding: 0.18rem 0.5rem;
            border-radius: 5px; color: white;
        }
        .result-name {
            font-size: 0.97rem; font-weight: 600;
            color: var(--text); white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .result-name mark {
            background: rgba(79,124,222,0.2);
            color: var(--accent);
            border-radius: 3px;
            padding: 0 1px;
        }
        html[data-theme="dark"] .result-name mark { background: rgba(79,124,222,0.35); }
        .result-meta {
            display: flex; align-items: center; gap: 0.5rem;
            flex-wrap: wrap; margin-top: 0.2rem;
        }
        .meta-pill {
            display: inline-flex; align-items: center; gap: 3px;
            font-size: 0.72rem; color: var(--muted);
            background: var(--border);
            border-radius: 5px; padding: 0.1rem 0.45rem;
        }
        .meta-pill svg { flex-shrink: 0; }
        .status-pill {
            font-size: 0.68rem; font-weight: 600;
            border-radius: 5px; padding: 0.1rem 0.45rem;
        }
        .status-pill.available { background: rgba(16,185,129,0.15); color: #10b981; }
        .status-pill.borrowed   { background: rgba(245,158,11,0.15); color: #f59e0b; }
        .status-pill.private    { background: rgba(100,116,139,0.15); color: #64748b; }
        .result-arrow { color: var(--muted); flex-shrink: 0; margin-left: auto; padding-top: 2px; }

        /* ── Skeleton loader ── */
        .skeleton-card {
            display: flex; align-items: center; gap: 1rem;
            padding: 0.9rem 1.1rem;
            border-bottom: 1px solid var(--border);
        }
        .skeleton-avatar {
            width: 44px; height: 44px; border-radius: 12px;
            background: var(--border);
            animation: shimmer 1.4s infinite;
        }
        .skeleton-lines { flex: 1; }
        .skeleton-line {
            height: 10px; border-radius: 5px;
            background: var(--border);
            margin-bottom: 8px;
            animation: shimmer 1.4s infinite;
        }
        .skeleton-line.short { width: 40%; }
        .skeleton-line.medium { width: 65%; }
        .skeleton-line.long { width: 85%; }
        @keyframes shimmer {
            0%   { opacity: 1; }
            50%  { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* ── Empty states ── */
        .empty-state-adv {
            padding: 3rem 2rem;
            text-align: center;
            color: var(--muted);
        }
        .empty-state-adv svg { margin-bottom: 0.75rem; opacity: 0.4; }
        .empty-state-adv h4 { margin: 0 0 0.4rem; color: var(--text); }
        .empty-state-adv p { margin: 0; font-size: 0.88rem; }

        /* ── Result count bar ── */
        .results-count-bar {
            font-size: 0.78rem;
            color: var(--muted);
            margin-bottom: 0.65rem;
            padding: 0 0.1rem;
            min-height: 1.2em;
        }

        /* ── No results category ── */
        .no-cat-results {
            padding: 2rem; text-align: center; color: var(--muted); font-size: 0.88rem;
        }

        /* ── Card outer ── */
        .results-card {
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: var(--card-bg);
            min-height: 120px;
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <header class="header">
            <div class="header-left">
                <button class="menu-toggle" id="menuToggle">☰</button>
                <a href="welcome.html" class="brand">
                    <img src="assets/Light_Logo3.png" alt="Logo" class="header-logo">
                </a>
            </div>
            <div class="header-center">
                <h1 class="page-title">Global Search</h1>
            </div>
            <div class="header-right"></div>
        </header>

        <div class="search-wrap">

            <!-- Search Box + Suggestions -->
            <div class="search-box-wrapper" id="searchBoxWrapper">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="globalSearchInput" class="search-box" placeholder='Search communities, items, users… (⌘K)' autocomplete="off" spellcheck="false">
                <span class="kbd-hint" id="kbdHint">⌘K</span>
                <button class="search-clear" id="searchClear" title="Clear" aria-label="Clear search">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>

                <!-- Suggestions dropdown -->
                <div class="suggestions-dropdown" id="suggestionsDropdown">
                    <!-- recent searches -->
                    <div class="recent-searches" id="recentSearchesBlock">
                        <div class="recent-header">
                            <span class="recent-label">Recent</span>
                            <button class="clear-recent-btn" onclick="clearAllRecent()">Clear all</button>
                        </div>
                        <div id="recentList"></div>
                        <hr class="suggestion-sep">
                    </div>
                    <!-- live suggestions -->
                    <div id="suggestionsList"></div>
                </div>
            </div>

            <!-- Filter toolbar -->
            <div class="search-toolbar" id="searchToolbar" style="display:none;">
                <button class="cat-chip active" data-filter="all" onclick="setFilter('all')">
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    All <span class="chip-count" id="cnt-all">0</span>
                </button>
                <button class="cat-chip" data-filter="Community" onclick="setFilter('Community')">
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    Communities <span class="chip-count" id="cnt-community">0</span>
                </button>
                <button class="cat-chip" data-filter="Item" onclick="setFilter('Item')">
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
                    Items <span class="chip-count" id="cnt-item">0</span>
                </button>
                <button class="cat-chip" data-filter="User" onclick="setFilter('User')">
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    Users <span class="chip-count" id="cnt-user">0</span>
                </button>
                <select class="sort-select" id="sortSelect" onchange="onSortChange()">
                    <option value="relevance">Relevance</option>
                    <option value="az">A → Z</option>
                    <option value="za">Z → A</option>
                </select>
            </div>

            <!-- Result count -->
            <div class="results-count-bar" id="resultsCountBar"></div>

            <!-- Results -->
            <div class="results-card" id="resultsCard">
                <div class="empty-state-adv">
                    <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <h4>Search LetsShare</h4>
                    <p>Find communities, items to borrow, and members.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="sidebar.js"></script>
    <script>
    (() => {
        // ── State ──────────────────────────────────────────────────────────────
        const input        = document.getElementById('globalSearchInput');
        const dropdown     = document.getElementById('suggestionsDropdown');
        const suggList     = document.getElementById('suggestionsList');
        const recentBlock  = document.getElementById('recentSearchesBlock');
        const recentList   = document.getElementById('recentList');
        const resultsCard  = document.getElementById('resultsCard');
        const toolbar      = document.getElementById('searchToolbar');
        const countBar     = document.getElementById('resultsCountBar');
        const clearBtn     = document.getElementById('searchClear');
        const kbdHint      = document.getElementById('kbdHint');

        let debounceTimer, suggestTimer;
        let activeFilter   = 'all';
        let allResults     = [];
        let currentQuery   = '';
        let focusedIdx     = -1; // for keyboard nav in dropdown
        let suggestFocused = -1;

        // ── Recent searches (localStorage) ────────────────────────────────────
        function getRecent() {
            try { return JSON.parse(localStorage.getItem('ls_recent_searches') || '[]'); } catch { return []; }
        }
        function saveRecent(arr) {
            localStorage.setItem('ls_recent_searches', JSON.stringify(arr.slice(0, 8)));
        }
        function addRecent(q) {
            if (!q || q.length < 2) return;
            let arr = getRecent().filter(x => x.toLowerCase() !== q.toLowerCase());
            arr.unshift(q);
            saveRecent(arr);
        }
        function removeRecent(q) {
            saveRecent(getRecent().filter(x => x !== q));
            renderRecentBlock();
        }
        function clearAllRecent() {
            saveRecent([]);
            renderRecentBlock();
        }
        window.clearAllRecent = clearAllRecent;

        function renderRecentBlock() {
            const arr = getRecent();
            if (!arr.length) { recentBlock.classList.remove('visible'); return; }
            recentBlock.classList.add('visible');
            recentList.innerHTML = arr.map(q => `
                <div class="recent-item" data-q="${escHtml(q)}">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted);flex-shrink:0"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    ${escHtml(q)}
                    <button class="recent-remove" data-remove-q="${escHtml(q)}" title="Remove">✕</button>
                </div>
            `).join('');
        }

        window.removeRecent = removeRecent;
        window.useRecent = function(q) {
            input.value = q;
            closeSuggestions();
            kbdHint.style.display = 'none';
            clearBtn.classList.add('visible');
            toolbar.style.display = 'flex';
            performSearch(q);
        };

        // ── Helpers ────────────────────────────────────────────────────────────
        function escHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function highlight(text, query) {
            if (!query || !text) return escHtml(text || '');
            const safe = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return escHtml(text).replace(new RegExp(`(${safe})`, 'gi'), '<mark>$1</mark>');
        }

        function categoryColor(cat) {
            return cat === 'Community' ? '#10b981' : cat === 'Item' ? '#3b82f6' : '#f59e0b';
        }

        function categoryIcon(cat) {
            const s = 'width:12px;height:12px;flex-shrink:0;fill:none;stroke:white;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round';
            if (cat === 'Community') return `<svg style="${s}" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`;
            if (cat === 'Item') return `<svg style="${s}" viewBox="0 0 24 24"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>`;
            return `<svg style="${s}" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
        }

        function skeleton() {
            return Array(4).fill('').map(() => `
                <div class="skeleton-card">
                    <div class="skeleton-avatar"></div>
                    <div class="skeleton-lines">
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line long"></div>
                        <div class="skeleton-line medium"></div>
                    </div>
                </div>
            `).join('');
        }

        function linkFor(r) {
            if (r.category === 'Community') return `community_Home.html?id=${r.id}`;
            if (r.category === 'Item')      return `item_View.html?id=${r.id}`;
            if (r.category === 'User')      return `user_View.html?id=${r.id}`;
            return '#';
        }

        function renderCard(r, query) {
            const color = categoryColor(r.category);
            const extra = buildMeta(r);
            return `
                <a href="${linkFor(r)}" class="result-card" onclick="addRecent(${JSON.stringify(query)})">
                    <div class="result-avatar" style="background:${color}">${escHtml(r.name.charAt(0).toUpperCase())}</div>
                    <div class="result-body">
                        <div class="result-top">
                            <span class="result-badge" style="background:${color}">${categoryIcon(r.category)} ${r.category}</span>
                        </div>
                        <div class="result-name">${highlight(r.name, query)}</div>
                        ${extra}
                    </div>
                    <div class="result-arrow">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                    </div>
                </a>`;
        }

        function buildMeta(r) {
            const pills = [];

            // subtext (location for community, category for item, @username for user)
            if (r.subtext) {
                pills.push(`<span class="meta-pill">
                    <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        ${r.category==='Community' ? '<path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/>' : r.category==='Item' ? '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>' : '<at-sign/>'}
                        ${r.category==='User' ? '@' : ''}
                    </svg>
                    ${escHtml(r.subtext)}
                </span>`);
            }

            // Community extras
            if (r.category === 'Community') {
                if (r.member_count > 0) pills.push(`<span class="meta-pill"><svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> ${r.member_count} member${r.member_count!==1?'s':''}</span>`);
                if (r.is_private) pills.push('<span class="status-pill private">🔒 Private</span>');
                if (r.chat_enabled) pills.push('<span class="meta-pill">💬 Chat</span>');
            }

            // Item extras
            if (r.category === 'Item') {
                if (r.extra1) pills.push(`<span class="meta-pill">by ${escHtml(r.extra1)}</span>`);
                if (r.price != null && r.price > 0) pills.push(`<span class="meta-pill">₹${Number(r.price).toFixed(0)}/day</span>`);
                if (r.extra2) pills.push(`<span class="meta-pill">${escHtml(r.extra2)}</span>`);
                if (r.status) {
                    const sc = r.status === 'available' ? 'available' : 'borrowed';
                    pills.push(`<span class="status-pill ${sc}">${r.status}</span>`);
                }
            }

            // User extras
            if (r.category === 'User') {
                if (r.extra1) pills.push(`<span class="meta-pill"><svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg> ${escHtml(r.extra1)}</span>`);
                if (r.extra2 && r.extra2 !== 'Free') pills.push(`<span class="meta-pill">⭐ ${escHtml(r.extra2)}</span>`);
            }

            if (!pills.length) return '';
            return `<div class="result-meta">${pills.join('')}</div>`;
        }

        // ── Filter & Sort ─────────────────────────────────────────────────────
        function setFilter(f) {
            activeFilter = f;
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.toggle('active', c.dataset.filter === f));
            renderResults();
        }
        window.setFilter = setFilter;

        function onSortChange() {
            const sort = document.getElementById('sortSelect').value;
            if (currentQuery) performSearch(currentQuery, sort);
        }
        window.onSortChange = onSortChange;

        function updateCounts(results) {
            const all  = results.length;
            const comm = results.filter(r => r.category === 'Community').length;
            const item = results.filter(r => r.category === 'Item').length;
            const user = results.filter(r => r.category === 'User').length;
            document.getElementById('cnt-all').textContent       = all;
            document.getElementById('cnt-community').textContent = comm;
            document.getElementById('cnt-item').textContent      = item;
            document.getElementById('cnt-user').textContent      = user;
        }

        function renderResults() {
            const filtered = activeFilter === 'all' ? allResults : allResults.filter(r => r.category === activeFilter);
            const q = currentQuery;

            if (!filtered.length) {
                const catName = activeFilter === 'all' ? 'anything' : activeFilter.toLowerCase() + 's';
                resultsCard.innerHTML = `
                    <div class="empty-state-adv">
                        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <h4>No ${catName} found</h4>
                        <p>Try a different search or filter.</p>
                    </div>`;
                countBar.textContent = '';
                return;
            }

            countBar.textContent = `${filtered.length} result${filtered.length !== 1 ? 's' : ''}${activeFilter !== 'all' ? ' · filtered' : ''}`;
            resultsCard.innerHTML = `<div class="results-list">${filtered.map(r => renderCard(r, q)).join('')}</div>`;
        }

        // ── Search ─────────────────────────────────────────────────────────────
        async function performSearch(query, sort) {
            sort = sort || document.getElementById('sortSelect').value;
            currentQuery = query;
            addRecent(query);
            closeSuggestions();
            toolbar.style.display = 'flex';
            resultsCard.innerHTML = skeleton();
            countBar.textContent  = 'Searching…';

            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`/api/users/global-search?q=${encodeURIComponent(query)}&sort=${sort}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const results = await res.json();

                if (!Array.isArray(results) || results.length === 0) {
                    allResults = [];
                    updateCounts([]);
                    resultsCard.innerHTML = `
                        <div class="empty-state-adv">
                            <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            <h4>No results for "${escHtml(query)}"</h4>
                            <p>Check your spelling or try a broader term.</p>
                        </div>`;
                    countBar.textContent = '0 results';
                    return;
                }

                allResults = results;
                updateCounts(results);
                renderResults();
            } catch (err) {
                resultsCard.innerHTML = `<div class="empty-state-adv"><h4>Search unavailable</h4><p>Please try again.</p></div>`;
                countBar.textContent  = '';
            }
        }

        // ── Suggestions dropdown ──────────────────────────────────────────────
        async function fetchSuggestions(query) {
            if (query.length < 1) { renderSuggestions([]); return; }
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`/api/users/search-suggestions?q=${encodeURIComponent(query)}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                renderSuggestions(await res.json());
            } catch { renderSuggestions([]); }
        }

        function renderSuggestions(items) {
            suggList.innerHTML = '';
            if (!items.length) {
                dropdown.classList.toggle('visible', recentBlock.classList.contains('visible'));
                return;
            }
            dropdown.classList.add('visible');
            suggList.innerHTML = `
                <div class="suggestions-section-label">Suggestions</div>
                ${items.map((s, i) => `
                    <div class="suggestion-item" data-idx="${i}" data-name="${escHtml(s.name)}">
                        <div class="suggestion-icon" style="background:${categoryColor(s.category)}">${categoryIcon(s.category)}</div>
                        <span>${highlight(s.name, input.value.trim())}</span>
                        <span class="suggestion-meta">${s.category}</span>
                    </div>
                `).join('')}
            `;
        }

        window.pickSuggestion = function(name) {
            input.value = name;
            closeSuggestions();
            clearBtn.classList.add('visible');
            kbdHint.style.display = 'none';
            performSearch(name);
        };

        function openDropdown() {
            renderRecentBlock();
            const hasRecent = getRecent().length > 0;
            const hasSugg   = suggList.innerHTML.trim().length > 0;
            if (hasRecent || hasSugg) dropdown.classList.add('visible');
        }

        function closeSuggestions() {
            dropdown.classList.remove('visible');
            suggestFocused = -1;
        }

        // ── Input events ──────────────────────────────────────────────────────
        input.addEventListener('input', e => {
            const q = e.target.value.trim();
            clearBtn.classList.toggle('visible', q.length > 0);
            kbdHint.style.display = q.length > 0 ? 'none' : '';

            clearTimeout(debounceTimer);
            clearTimeout(suggestTimer);

            if (q.length < 1) {
                suggList.innerHTML = '';
                openDropdown();
                toolbar.style.display = 'none';
                resultsCard.innerHTML = `<div class="empty-state-adv"><svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><h4>Search LetsShare</h4><p>Find communities, items to borrow, and members.</p></div>`;
                countBar.textContent = '';
                allResults = [];
                return;
            }

            // fast suggestions (150ms)
            suggestTimer = setTimeout(() => fetchSuggestions(q), 150);
            // full search (380ms)
            debounceTimer = setTimeout(() => performSearch(q), 380);
        });

        input.addEventListener('focus', () => {
            openDropdown();
        });

        document.addEventListener('click', e => {
            if (!document.getElementById('searchBoxWrapper').contains(e.target)) closeSuggestions();
        });

        // ── Keyboard navigation ───────────────────────────────────────────────
        input.addEventListener('keydown', e => {
            const items = dropdown.querySelectorAll('.suggestion-item, .recent-item');
            if (!dropdown.classList.contains('visible') || !items.length) {
                if (e.key === 'Enter' && input.value.trim()) {
                    performSearch(input.value.trim());
                }
                return;
            }
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                suggestFocused = Math.min(suggestFocused + 1, items.length - 1);
                items.forEach((el, i) => el.classList.toggle('focused', i === suggestFocused));
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                suggestFocused = Math.max(suggestFocused - 1, -1);
                items.forEach((el, i) => el.classList.toggle('focused', i === suggestFocused));
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (suggestFocused >= 0 && items[suggestFocused]) {
                    items[suggestFocused].click();
                } else if (input.value.trim()) {
                    performSearch(input.value.trim());
                }
            } else if (e.key === 'Escape') {
                closeSuggestions();
            }
        });

        // Also keyboard nav through result cards
        document.addEventListener('keydown', e => {
            if (document.activeElement !== input) {
                const cards = resultsCard.querySelectorAll('.result-card');
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    focusedIdx = Math.min(focusedIdx + 1, cards.length - 1);
                    cards.forEach((c, i) => c.classList.toggle('focused', i === focusedIdx));
                    cards[focusedIdx]?.scrollIntoView({ block: 'nearest' });
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    focusedIdx = Math.max(focusedIdx - 1, 0);
                    cards.forEach((c, i) => c.classList.toggle('focused', i === focusedIdx));
                    cards[focusedIdx]?.scrollIntoView({ block: 'nearest' });
                } else if (e.key === 'Enter' && focusedIdx >= 0) {
                    cards[focusedIdx]?.click();
                }
            }
        });

        // ── Clear button ──────────────────────────────────────────────────────
        document.getElementById('searchClear').addEventListener('click', () => {
            input.value = '';
            clearBtn.classList.remove('visible');
            kbdHint.style.display = '';
            toolbar.style.display = 'none';
            countBar.textContent  = '';
            allResults = [];
            suggList.innerHTML    = '';
            resultsCard.innerHTML = `<div class="empty-state-adv"><svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><h4>Search LetsShare</h4><p>Find communities, items to borrow, and members.</p></div>`;
            openDropdown();
            input.focus();
        });

        // ── ⌘K / Ctrl+K shortcut ─────────────────────────────────────────────
        document.addEventListener('keydown', e => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                e.preventDefault();
                input.focus();
                input.select();
                openDropdown();
            }
        });

        // ── Init ─────────────────────────────────────────────────────────────
        
        // ── Event delegation for recent items and suggestions clicks ──────────
        document.getElementById('suggestionsDropdown').addEventListener('click', e => {
            const removeBtn = e.target.closest('.recent-remove');
            if (removeBtn) {
                e.stopPropagation();
                const q = removeBtn.getAttribute('data-remove-q');
                if (window.removeRecent) window.removeRecent(q);
                return;
            }
            const recentItem = e.target.closest('.recent-item');
            if (recentItem) {
                const q = recentItem.getAttribute('data-q');
                if (window.useRecent) window.useRecent(q);
                return;
            }
            const suggItem = e.target.closest('.suggestion-item');
            if (suggItem) {
                const name = suggItem.getAttribute('data-name');
                if (window.pickSuggestion) window.pickSuggestion(name);
                return;
            }
        });

        window.addRecent = addRecent;

        // Pre-fill from URL param
        const urlQ = new URLSearchParams(location.search).get('q');
        if (urlQ) {
            input.value = urlQ;
            clearBtn.classList.add('visible');
            kbdHint.style.display = 'none';
            performSearch(urlQ);
        }
    })();
    </script>
</body>
</html>
