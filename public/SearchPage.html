<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <script>
        (function() {
            var savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Search - LetsShare</title>
    <link rel="icon" href="assets/Light_Logo1.png" type="image/jpeg">
    <link rel="stylesheet" href="style.css">
    <style>
        .search-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem;
        }
        .search-box-wrapper {
            position: relative;
            margin-bottom: 1.5rem;
        }
        .search-box {
            width: 100%;
            padding: 1.25rem 1.5rem 1.25rem 3.5rem;
            font-size: 1.2rem;
            border-radius: 16px;
            border: 2px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            transition: all 0.3s ease;
        }
        .search-box:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 4px rgba(79, 124, 222, 0.1);
        }
        .search-icon-large {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.5rem;
            color: var(--muted);
        }
        .result-item {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: background 0.2s ease;
            text-decoration: none;
            color: inherit;
        }
        .result-item:hover {
            background: rgba(0,0,0,0.02);
        }
        html[data-theme="dark"] .result-item:hover {
            background: rgba(255,255,255,0.02);
        }
        .result-category {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            background: var(--accent);
            color: white;
            margin-bottom: 0.25rem;
            display: inline-block;
        }
        .result-subtext {
            font-size: 0.85rem;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <header class="header">
            <div class="header-left">
                <button class="menu-toggle" id="menuToggle">☰</button>
                <a href="welcome.html" class="brand">
                    <img src="assets/Light_Logo3.png" alt="Logo" class="header-logo">
                </a>
            </div>
            <div class="header-center">
                <h1 class="page-title">Global Search</h1>
            </div>
            <div class="header-right">
                <!-- Dashboard in sidebar -->
            </div>
        </header>

        <div class="search-container" style="max-width: 1200px;">
            <div class="search-box-wrapper">
                <i data-lucide="search" class="search-icon-large" style="position: absolute; left: 1.25rem; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; color: var(--muted); pointer-events: none;"></i>
                <input type="text" id="globalSearchInput" class="search-box" placeholder="Search communities, items, or users..." autofocus style="padding-left: 3.5rem;">
            </div>

            <div id="searchResults" class="card" style="padding: 0; min-height: 200px;">
                <p class="empty-state" style="padding: 3rem;">Start typing to search across the platform.</p>
            </div>
        </div>
    </div>

    <script src="sidebar.js"></script>
    <script>
        const searchInput = document.getElementById('globalSearchInput');
        const resultsContainer = document.getElementById('searchResults');

        let debounceTimer;

        // Initialize Lucide icons on load
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) {
                lucide.createIcons();
            } else {
                setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 500);
            }
        });

        searchInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            const query = e.target.value.trim();
            
            if (query.length < 1) {
                resultsContainer.innerHTML = '<p class="empty-state" style="padding: 3rem;">Start typing to search across the platform.</p>';
                return;
            }

            debounceTimer = setTimeout(() => performSearch(query), 300);
        });

        async function performSearch(query) {
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`/api/users/global-search?q=${encodeURIComponent(query)}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const results = await res.json();
                
                if (!Array.isArray(results) || results.length === 0) {
                    resultsContainer.innerHTML = '<p class="empty-state" style="padding: 3rem;">No results found for "' + query + '"</p>';
                    if (results.error) {
                        resultsContainer.innerHTML = '<p class="empty-state" style="padding: 3rem; color: var(--danger);">' + results.error + '</p>';
                    }
                    return;
                }

                resultsContainer.innerHTML = results.map(r => {
                    let link = '#';
                    if (r.category === 'Community') link = `community_Home.html?id=${r.id}`;
                    else if (r.category === 'Item') link = `item_Details.html?id=${r.id}`;
                    else if (r.category === 'User') link = `user_View.html?id=${r.id}`; 

                    return `
                        <a href="${link}" class="result-item">
                            <div class="header-avatar" style="width: 40px; height: 40px; flex-shrink: 0;">${r.name.charAt(0).toUpperCase()}</div>
                            <div style="flex-grow: 1;">
                                <span class="result-category" style="background: ${getCategoryColor(r.category)}; display: inline-flex; align-items: center; gap: 4px; padding: 0.25rem 0.6rem; border-radius: 6px; font-size: 0.75rem;">
                                    ${getCategoryIcon(r.category)} ${r.category}
                                </span>
                                <h4 style="margin: 0; margin-top: 0.25rem;">${r.name}</h4>
                                <p class="result-subtext" style="margin: 0;">${r.subtext}</p>
                            </div>
                            <span style="color: var(--muted);">→</span>
                        </a>
                    `;
                }).join('');

                if (window.lucide) {
                    lucide.createIcons();
                }
            } catch (err) {
                console.error('Search error:', err);
            }
        }

        function getCategoryColor(cat) {
            switch(cat) {
                case 'Community': return '#10b981';
                case 'Item': return '#3b82f6';
                case 'User': return '#f59e0b';
                default: return '#64748b';
            }
        }

        function getCategoryIcon(cat) {
            const s = 'width:12px;height:12px;display:inline-block;vertical-align:middle;fill:none;stroke:white;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round';
            switch (cat) {
                case 'Community': return `<svg style="${s}" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`;
                case 'Item': return `<svg style="${s}" viewBox="0 0 24 24"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>`;
                case 'User': return `<svg style="${s}" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
                default: return `<svg style="${s}" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`;
            }
        }
    </script>
</body>
</html>
