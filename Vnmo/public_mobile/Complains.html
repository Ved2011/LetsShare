<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <script>
        (function() {
            var savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaints - LetsShare</title>
    <link rel="icon" href="assets/Light_Logo1.png" type="image/jpeg">
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .complaints-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-height: 350px;
        }

        .complaints-card h3 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .complaints-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
            max-height: 450px;
            padding-right: 0.5rem;
        }

        .complaint-item {
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            position: relative;
        }

        .complaint-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .complaint-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text);
        }

        .badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 999px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .badge.high { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        .badge.medium { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
        .badge.low { background: rgba(16, 185, 129, 0.1); color: var(--success); }

        .badge.open { background: rgba(99, 102, 241, 0.1); color: var(--accent); }
        .badge.resolved { background: rgba(16, 185, 129, 0.1); color: var(--success); }

        .complaint-meta {
            font-size: 0.8rem;
            color: var(--muted);
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .complaint-desc {
            font-size: 0.88rem;
            color: var(--text);
            line-height: 1.4;
        }

        /* FAB Button */
        .fab-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent);
            color: white;
            border: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            z-index: 999;
            transition: transform 0.2s, background 0.2s;
        }

        .fab-btn:hover {
            transform: scale(1.1);
            background: var(--accent-dark);
        }

        /* Modal overlay styling */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 550px;
            padding: 2rem;
            box-shadow: var(--shadow);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1.25rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--muted);
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            color: var(--muted);
            margin: auto 0;
            padding: 2rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <header class="header">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <a href="user_Dashboard.html" class="brand">
                    <img src="assets/Light_Logo3.png" alt="LetsShare" class="logo" style="max-height: 40px; border-radius: 4px;">
                </a>
                <span style="font-weight: 600; color: var(--accent); white-space: nowrap;">Complaints</span>
            </div>
            <div class="auth-buttons desktop-only">
                <a href="user_Profile.html" class="header-avatar" id="headerAvatar">?</a>
            </div>
        </header>

        <!-- Dashboard Section -->
        <div class="dashboard-grid">
            <!-- Unresolved reported by user -->
            <div class="complaints-card">
                <h3>
                    <span>Reported by You (Unresolved)</span>
                </h3>
                <div class="complaints-list" id="reportedList">
                    <div class="empty-state">Loading complaints...</div>
                </div>
            </div>

            <!-- Complaints against the user -->
            <div class="complaints-card">
                <h3>
                    <span>Complaints Against You</span>
                </h3>
                <div class="complaints-list" id="againstList">
                    <div class="empty-state">Loading complaints...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Action Button -->
    <button class="fab-btn" id="openReportModalBtn" title="Report a Complaint">+</button>

    <!-- Report Complaint Modal -->
    <div class="modal-overlay" id="reportModalOverlay">
        <div class="modal-container">
            <button class="modal-close" id="closeReportModalBtn">&times;</button>
            <h2>Report an Issue</h2>
            <div id="confirmationMessage" class="message" style="display: none;"></div>
            <div id="errorMessage" class="message" style="display: none;"></div>

            <form id="issueForm" style="margin-top: 1.5rem;">
                <div class="form-group">
                    <label for="borrowId">Borrow ID</label>
                    <input type="text" id="borrowId" required placeholder="e.g., BR-1718000000000">
                </div>

                <div class="form-group">
                    <label for="itemName">Item Name</label>
                    <input type="text" id="itemName" required placeholder="e.g., Mountain Bike">
                </div>

                <div class="form-group">
                    <label for="borrowerName">Borrower Name</label>
                    <input type="text" id="borrowerName" required placeholder="e.g., John Doe">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="issueType">Issue Type</label>
                        <select id="issueType" required>
                            <option value="">Select issue</option>
                            <option value="damage">Damage</option>
                            <option value="lost">Lost Item</option>
                            <option value="late">Late Return</option>
                            <option value="misuse">Misuse</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="severity">Severity</label>
                        <select id="severity" required>
                            <option value="">Select severity</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="issueDescription">Description</label>
                    <textarea id="issueDescription" required placeholder="Describe the issue in detail..." style="min-height: 100px;"></textarea>
                </div>

                <div class="form-group">
                    <label for="beforeImage">Before Image (when given)</label>
                    <input type="file" id="beforeImage" accept="image/*">
                </div>

                <div class="form-group">
                    <label for="afterImage">After Image (current condition)</label>
                    <input type="file" id="afterImage" accept="image/*" required>
                </div>

                <div class="form-actions" style="margin-top: 1.5rem;">
                    <button type="submit" class="btn primary">Submit Report</button>
                    <button type="button" class="btn outline" id="cancelFormBtn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="notifications.js"></script>
    <script src="sidebar.js"></script>
    <script src="Complains.js"></script>
</body>
</html>
