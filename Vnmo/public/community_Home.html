<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Home - LetsShare</title>
    <link rel="icon" href="assets/Logo3.jpeg" type="image/jpeg">
    <link rel="stylesheet" href="style.css">
    <style>
        .community-header-hero {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: white;
            padding: 3rem 2rem;
            border-radius: 24px;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }
        .community-header-hero::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            pointer-events: none;
        }
        .chat-container-home {
            height: 60vh;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
        }
        #chatBox {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .chat-input-area {
            padding: 1rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 0.75rem;
        }
        .chat-msg {
            max-width: 80%;
            padding: 0.8rem 1rem;
            border-radius: 14px;
            font-size: 0.95rem;
            position: relative;
        }
        .chat-msg.mine {
            align-self: flex-end;
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 2px;
        }
        .chat-msg.theirs {
            align-self: flex-start;
            background: #f1f5f9;
            color: var(--text);
            border-bottom-left-radius: 2px;
        }
        .msg-info {
            display: block;
            font-size: 0.7rem;
            margin-bottom: 0.2rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
    <div class="page-wrapper">
        <header class="header">
            <div class="header-left">
                <button class="menu-toggle" id="menuToggle">☰</button>
                <a href="welcome.html" class="brand">
                    <img src="assets/Logo1.jpeg" alt="Logo" class="header-logo">
                </a>
            </div>
            <div class="header-center">
                <h1 class="page-title" id="communityName">no communities</h1>
            </div>
            <div class="header-right">
                <input type="text" id="communityHomeSearch" placeholder="Search items or members..." class="input-minimal" style="width: 200px;" />
            </div>
        </header>

        <div class="community-header-hero">
            <h2 id="heroCommName">Community Name</h2>
            <p id="heroCommAddress">📍 no address</p>
            <div style="display: flex; gap: 1.5rem; margin-top: 1.5rem;">
                <div>
                    <strong id="memberCount">0</strong>
                    <span style="opacity: 0.9;"> Members</span>
                </div>
                <div>
                    <strong id="itemCount">0</strong>
                    <span style="opacity: 0.9;"> Items</span>
                </div>
            </div>
        </div>

        <div class="community-content-wrapper">
            <!-- Left Side: Recent Uploads -->
            <section>
                <div class="section-heading">
                    <h3>Recent Uploads</h3>
                </div>
                <div id="communityItemsGrid" class="items-square-grid">
                    <!-- Items will be loaded here -->
                </div>
                
                <div id="memberSearchResults" class="hidden" style="margin-top: 2rem;">
                    <h3>Members</h3>
                    <div id="membersGrid" class="community-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem;"></div>
                </div>
            </section>

            <!-- Right Side: Chat -->
            <section id="chatSectionHome">
                <div class="section-heading">
                    <h3>Community Chat</h3>
                </div>
                <div class="chat-container-home" id="chatDisabledMsg" style="display: none; justify-content: center; align-items: center; text-align: center; padding: 2rem;">
                    <div>
                        <span style="font-size: 3rem;">🔒</span>
                        <p style="margin-top: 1rem; color: var(--muted);">Chat is disabled for this community.</p>
                    </div>
                </div>
                <div class="chat-container-home" id="chatActiveArea">
                    <div id="chatBox"></div>
                    <div class="chat-input-area">
                        <input type="text" id="chatInput" placeholder="Type a message..." class="search-bar" style="border-radius: 12px; padding-left: 1rem;">
                        <button id="sendChatBtn" class="btn primary small">Send</button>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="notifications.js"></script>
    <script src="sidebar.js"></script>
    <script src="community_Home.js"></script>
</body>
</html>
