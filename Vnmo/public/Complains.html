<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <script>
        (function() {
            var savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaints - LetsShare</title>
    <link rel="icon" href="assets/Light_Logo1.png" type="image/jpeg">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <div class="page-wrapper">
        <header class="header">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <a href="user_Dashboard.html" class="brand">
                    <img src="assets/Light_Logo3.png" alt="LetsShare" class="logo" style="max-height: 40px; border-radius: 4px;">
                </a>
                <span style="font-weight: 600; color: var(--accent); white-space: nowrap;">Complaints</span>
            </div>
            <div class="auth-buttons desktop-only">
                <a href="user_Profile.html" class="header-avatar" id="headerAvatar">?</a>
            </div>
        </header>

        <div class="form-card">
            <h2>Report an Issue</h2>
            <div id="confirmationMessage" class="message"></div>
            <div id="errorMessage" class="message"></div>

            <form id="issueForm">

                <div class="form-group">
                    <label for="borrowId">Borrow ID</label>
                    <input type="text" id="borrowId" required>
                </div>

                <div class="form-group">
                    <label for="itemName">Item Name</label>
                    <input type="text" id="itemName" required>
                </div>

                <div class="form-group">
                    <label for="borrowerName">Borrower Name</label>
                    <input type="text" id="borrowerName" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="issueType">Issue Type</label>
                        <select id="issueType" required>
                            <option value="">Select issue</option>
                            <option value="damage">Damage</option>
                            <option value="lost">Lost Item</option>
                            <option value="late">Late Return</option>
                            <option value="misuse">Misuse</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="severity">Severity</label>
                        <select id="severity" required>
                            <option value="">Select severity</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="issueDescription">Description</label>
                    <textarea type="text" id="issueDescription" required></textarea>
                </div>

                <div class="form-group">
                    <label for="beforeImage">Before (when given)</label>
                    <input type="file" id="beforeImage" accept="image/*">
                </div>

                <div class="form-group">
                    <label for="afterImage">After (current condition)</label>
                    <input type="file" id="afterImage" accept="image/*" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Submit Report</button>
                    <button type="clear" class="btn-secondary">Clear</button>
                </div>

            </form>
        </div>
    </div>

    <script src="notifications.js"></script>
    <script src="sidebar.js"></script>
    <script src="Complains.js"></script>
</body>
</html>
